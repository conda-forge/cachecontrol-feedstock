schema_version: 1

context:
  version: "0.15.0"

recipe:
  name: cachecontrol
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/c/cachecontrol/cachecontrol-${{ version }}.tar.gz
  sha256: 52157b539eb64d85c8c793660e86cf05cf95fad7b98c8ef6846e4a0ddffdb193

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: cachecontrol
    build:
      noarch: python
      script: ${{ PYTHON }} -m pip install . -vv
      python:
        entry_points:
          - doesitcache = cachecontrol._cmd:main
    requirements:
      host:
        - python ${{ python_min }}.*
        - uv-build >=0.9.6,<0.14.0
        - pip
      run:
        - python >=${{ python_min }}
        - requests >=2.16.0
        - msgpack-python >=0.5.2,<2.0.0

    tests:
      - python:
          imports:
            - cachecontrol
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - "*"
      - requirements:
          run:
            - pip
            - python ${{ python_min }}.*
        script:
          - doesitcache --help

  - package:
      name: cachecontrol-with-redis
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage("cachecontrol", exact=True) }}
        - redis-py >=2.10.5
    tests:
      - python:
          pip_check: true

  - package:
      name: cachecontrol-with-filecache
    build:
      noarch: python
    requirements:
      host:
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
        - ${{ pin_subpackage("cachecontrol", exact=True) }}
        - filelock >=3.8.0
    tests:
      - python:
          pip_check: true

about:
  summary: httplib2 caching for requests
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/CacheControl/
  repository: https://github.com/psf/cachecontrol

extra:
  recipe-maintainers:
    - djsutherland
    - ocefpaf
